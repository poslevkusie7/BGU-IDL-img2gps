
# config/example.yaml
task: coords                # coords or multitask
csv_path: data/metadata2.csv
img_dir: data/images

batch_size: 16
epochs: 400
lr: 1.0e-4
weight_decay: 1.0e-4
num_workers: 4
seed: 42
amp: true
optimizer: adamw
save_path: model.pt
best_path: best_model.pt

freeze_epochs: 0
randaugment: false
ra_n: 2
ra_m: 9

coord_mode: latlon
coord_norm: standard
dinov2_name: vit_base_patch14_dinov2.lvd142m

cls_weight: 1.0
coord_weight: 1.0

scheduler: cosine_warmup  # options: none, cosine, cosine_warmup
warmup_steps: 100
accum_steps: 1
